name: Bootstrap npm lockfile

on:
  workflow_dispatch:
  push:
    branches: [chore/m0-scaffold]
    paths:
      - package.json
      - tools/**
      - tests/**
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/m0-scaffold
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile for audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(m0): generate npm lockfile"
            git push
          fi
      - name: Verify deterministic install and harness tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Record verification and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-lock.yml
          git add .github/workflows/bootstrap-lock.yml
          git commit -m "test(m0): verify deterministic npm install"
          git push
