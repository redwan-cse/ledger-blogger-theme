name: Bootstrap npm lockfile

on:
  push:
    branches: [chore/m0-scaffold]
    paths:
      - package.json
      - .github/workflows/bootstrap-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/m0-scaffold
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate and verify lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Commit verified lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json .github/workflows/bootstrap-lock.yml
          git commit -m "chore(m0): commit verified npm lockfile"
          git push
