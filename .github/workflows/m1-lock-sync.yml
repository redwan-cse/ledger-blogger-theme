name: Synchronize M1 lockfile metadata
on:
  push:
    branches: [feat/m1-generation-pipeline]
    paths: [.github/workflows/m1-lock-sync.yml]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m1-generation-pipeline
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized metadata and retire workflow
        run: |
          rm .github/workflows/m1-lock-sync.yml
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json .github/workflows/m1-lock-sync.yml
          git commit -m 'chore(m1): sync lockfile metadata'
          git push origin HEAD:feat/m1-generation-pipeline
