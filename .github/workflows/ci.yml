name: CI
on:
  push:
    branches: [main, feat/m2-render-path]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Enforce fetch-denied contract budget (NFR-2)
        shell: bash
        run: |
          start=$(date +%s%3N)
          npm run test:contract
          elapsed=$(( $(date +%s%3N) - start ))
          echo "Contract suite: ${elapsed}ms" >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 5000
      - name: Audit CI policy and bisect stage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          failures = []
          tokens = ('continue-' + 'on-error', '|' + '| true')
          for path in Path('.github/workflows').glob('*.yml'):
              text = path.read_text()
              for token in tokens:
                  if token in text:
                      failures.append(f'{path}: forbidden {token}')
          source = Path('src/widgets/blog.pug').read_text()
          if "b:include(name='super.main')" not in source:
              failures.append('src/widgets/blog.pug: native dispatch missing')
          if source.count('b:includable(') != 1:
              failures.append('bisect stage must override only main')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce cold generation budget (NFR-1)
        shell: bash
        run: |
          rm -rf dist
          start=$(date +%s%3N)
          npm run generate
          elapsed=$(( $(date +%s%3N) - start ))
          echo "Cold generation: ${elapsed}ms" >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 10000
      - run: npm run contract:check
      - run: npm run test:golden
      - name: Enforce theme size budget
        run: test "$(wc -c < dist/theme.xml)" -le 200000
      - uses: actions/upload-artifact@v7
        with:
          name: theme-${{ github.sha }}
          path: dist/theme.xml
          if-no-files-found: error
          retention-days: 7
