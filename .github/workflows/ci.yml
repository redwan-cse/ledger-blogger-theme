name: CI
on:
  push:
    branches: [main, feat/m2-render-path]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Enforce fetch-denied contract budget (NFR-2)
        shell: bash
        run: |
          start=$(date +%s%3N)
          npm run test:contract
          elapsed=$(( $(date +%s%3N) - start ))
          echo "Contract suite: ${elapsed}ms" >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 45000
      - name: Audit CI policy and Blogger layout bindings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          failures = []
          tokens = ('continue-' + 'on-error', '|' + '| true')
          for path in Path('.github/workflows').glob('*.yml'):
              text = path.read_text()
              for token in tokens:
                  if token in text:
                      failures.append(f'{path}: forbidden {token}')
          shell = Path('src/theme.pug').read_text()
          if "name='all-head-content'" not in shell:
              failures.append('src/theme.pug: all-head-content include missing')
          if 'main#content.main-content' not in shell:
              failures.append('src/theme.pug: Posts section must sit inside a main element')
          header = Path('src/widgets/header.pug').read_text()
          if "id='header'" not in header or "id='Header1'" not in header:
              failures.append('src/widgets/header.pug: must bind section header and widget Header1')
          blog = Path('src/widgets/blog.pug').read_text()
          if "id='page_body'" not in blog or "id='Blog1'" not in blog:
              failures.append('src/widgets/blog.pug: must bind section page_body and widget Blog1')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce cold generation budget (NFR-1)
        shell: bash
        run: |
          rm -rf dist
          start=$(date +%s%3N)
          npm run generate
          elapsed=$(( $(date +%s%3N) - start ))
          echo "Cold generation: ${elapsed}ms" >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 10000
      - run: npm run contract:check
      - run: npm run test:golden
      - name: Enforce theme size budget
        run: test "$(wc -c < dist/theme.xml)" -le 500000
      - uses: actions/upload-artifact@v7
        with:
          name: theme-${{ github.sha }}
          path: dist/theme.xml
          if-no-files-found: error
          retention-days: 7
