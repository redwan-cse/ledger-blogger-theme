name: CI
on:
  push:
    branches: [main, feat/m1-generation-pipeline]
  pull_request:
permissions:
  contents: read
  issues: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness-contract:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run typed contract suite
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          type_status=${PIPESTATUS[0]}
          npm test 2>&1 | tee tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$type_status" -ne 0 || "$test_status" -ne 0 ]]; then
            {
              echo 'M1 contract diagnostic for `${{ github.sha }}`:'
              echo
              echo '```text'
              cat typecheck.log tests.log
              echo '```'
            } > diagnostic.md
            gh issue comment 5 --body-file diagnostic.md
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
  generate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run generate
      - run: npm run contract:check
      - name: Enforce theme size budget
        run: test "$(wc -c < dist/theme.xml)" -le 200000
      - uses: actions/upload-artifact@v7
        with:
          name: theme-${{ github.sha }}
          path: dist/theme.xml
          if-no-files-found: error
          retention-days: 7
