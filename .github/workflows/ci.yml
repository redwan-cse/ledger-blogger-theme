name: CI
on:
  push:
    branches: [main, feat/m1-generation-pipeline]
  pull_request:
permissions:
  contents: read
  issues: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness-contract:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run typed contract suite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          type_status=${PIPESTATUS[0]}
          npm test 2>&1 | tee tests.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$type_status" -ne 0 || "$test_status" -ne 0 ]]; then
            { echo 'M1 harness diagnostic for `${{ github.sha }}`:'; echo; echo '```text'; cat typecheck.log tests.log; echo '```'; } > diagnostic.md
            jq -Rs '{body: .}' diagnostic.md | curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' --data-binary @- https://api.github.com/repos/${{ github.repository }}/issues/5/comments
            exit 1
          fi
  generate:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run generation contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run generate 2>&1 | tee generate.log
          generate_status=${PIPESTATUS[0]}
          if [[ "$generate_status" -eq 0 ]]; then npm run contract:check 2>&1 | tee contract.log; contract_status=${PIPESTATUS[0]}; else contract_status=1; fi
          set -e
          if [[ "$generate_status" -ne 0 || "$contract_status" -ne 0 ]]; then
            { echo 'M1 generate diagnostic for `${{ github.sha }}`:'; echo; echo '```text'; cat generate.log; if [[ -f contract.log ]]; then cat contract.log; fi; echo '```'; } > diagnostic.md
            jq -Rs '{body: .}' diagnostic.md | curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' --data-binary @- https://api.github.com/repos/${{ github.repository }}/issues/5/comments
            exit 1
          fi
      - name: Enforce theme size budget
        run: test "$(wc -c < dist/theme.xml)" -le 200000
      - uses: actions/upload-artifact@v7
        with:
          name: theme-${{ github.sha }}
          path: dist/theme.xml
          if-no-files-found: error
          retention-days: 7
