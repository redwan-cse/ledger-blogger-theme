name: CI
on:
  push:
    branches: [main, feat/m2-render-path]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  harness-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Enforce fetch-denied contract budget (NFR-2)
        shell: bash
        run: |
          start=$(date +%s%3N)
          npm run test:contract
          elapsed=$(( $(date +%s%3N) - start ))
          echo "Contract suite: ${elapsed}ms" >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 5000
      - name: Reject CI escape hatches (NFR-6/NFR-7)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          banned = ('continue-' + 'on-error', '|' + '| true')
          failures = []
          for path in Path('.github/workflows').glob('*.yml'):
              text = path.read_text()
              for token in banned:
                  if token in text:
                      failures.append(f'{path}: {token}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY
  generate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Enforce cold generation budget (NFR-1)
        shell: bash
        run: |
          rm -rf dist
          start=$(date +%s%3N)
          npm run generate
          elapsed=$(( $(date +%s%3N) - start ))
          echo "Cold generation: ${elapsed}ms" >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -lt 10000
      - run: npm run contract:check
      - run: npm run test:golden
      - name: Enforce theme size budget
        run: test "$(wc -c < dist/theme.xml)" -le 200000
      - uses: actions/upload-artifact@v7
        with:
          name: theme-${{ github.sha }}
          path: dist/theme.xml
          if-no-files-found: error
          retention-days: 7
