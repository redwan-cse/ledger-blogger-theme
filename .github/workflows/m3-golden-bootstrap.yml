name: M3 golden snapshot bootstrap (self-deleting)
# Run 4: retrigger after fixing the real bug the new rule found: the
# .post-excerpt exception needs to match the compound mobile-override
# selector, not just the bare class.
on:
  push:
    branches: [feat/m3-design-system]
    paths: [.github/workflows/m3-golden-bootstrap.yml]
permissions:
  contents: write
concurrency:
  group: m3-golden-bootstrap
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m3-design-system
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contract
      - run: npm run generate
      - run: npm run contract:check
      - name: Refresh the golden snapshot and delete this workflow
        run: |
          node update-golden.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m3-golden-bootstrap.yml
          git add tests/golden/theme.xml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "test(m3): refresh golden snapshot for design-system split"
            git push
          fi
