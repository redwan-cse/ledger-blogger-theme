name: Build M0 empty theme
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsx tools/create-empty-theme.ts
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65832a22e0940fb921 # v4.4.3
        with:
          name: m0-empty-theme-${{ github.sha }}
          path: dist/m0/
          if-no-files-found: error
          retention-days: 7
