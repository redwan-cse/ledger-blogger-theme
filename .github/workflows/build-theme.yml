name: Build theme artifact
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      theme_sha:
        description: Full 40-character commit SHA to build the immutable theme artifact from (optional; defaults to HEAD)
        required: false
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve target theme SHA
        id: resolve
        run: |
          TARGET_SHA="${{ inputs.theme_sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="${{ github.sha }}"
          fi
          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::theme_sha must be a full lowercase 40-character commit SHA, got '$TARGET_SHA'"
            exit 1
          fi
          echo "theme_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate theme with explicit THEME_SHA
        env:
          THEME_SHA: ${{ steps.resolve.outputs.theme_sha }}
        run: npm run generate
      - name: Assert emitted build stamp matches 0.0.0+<theme_sha>
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.theme_sha }}
        run: |
          node -e '
            const fs = require("fs");
            const xml = fs.readFileSync("dist/theme.xml", "utf8");
            const expected = "0.0.0+" + process.env.EXPECTED_SHA;
            const match = xml.match(/content=["\x27]([^"\x27]+)["\x27]\s+name=["\x27]theme-build["\x27]/) || xml.match(/name=["\x27]theme-build["\x27]\s+content=["\x27]([^"\x27]+)["\x27]/);
            const actual = match ? match[1] : "";
            console.log("Expected stamp: " + expected);
            console.log("Actual stamp:   " + actual);
            if (actual !== expected) {
              console.error("::error::Generated theme stamp mismatch: expected " + expected + ", got " + actual);
              process.exit(1);
            }
          '
      - run: npm run contract:check
      - uses: actions/upload-artifact@v7
        with:
          name: theme-artifact-${{ steps.resolve.outputs.theme_sha }}
          path: dist/theme.xml
          if-no-files-found: error
          retention-days: 90
