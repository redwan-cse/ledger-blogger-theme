name: Build theme artifact
on:
  workflow_dispatch:
    inputs:
      theme_sha:
        description: Full 40-character commit SHA to build the immutable theme artifact from
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate theme SHA format
        run: |
          if ! printf '%s' "${{ inputs.theme_sha }}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::theme_sha must be a full lowercase 40-character commit SHA, got '${{ inputs.theme_sha }}'"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout target commit SHA
        run: git checkout "${{ inputs.theme_sha }}"
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate theme with explicit THEME_SHA
        env:
          THEME_SHA: ${{ inputs.theme_sha }}
        run: npm run generate
      - name: Assert emitted build stamp matches 0.0.0+<theme_sha>
        env:
          EXPECTED_SHA: ${{ inputs.theme_sha }}
        run: |
          node -e '
            const fs = require("fs");
            const xml = fs.readFileSync("dist/theme.xml", "utf8");
            const expected = "0.0.0+" + process.env.EXPECTED_SHA;
            const match = xml.match(/content=["\x27]([^"\x27]+)["\x27]\s+name=["\x27]theme-build["\x27]/) || xml.match(/name=["\x27]theme-build["\x27]\s+content=["\x27]([^"\x27]+)["\x27]/);
            const actual = match ? match[1] : "";
            console.log("Expected stamp: " + expected);
            console.log("Actual stamp:   " + actual);
            if (actual !== expected) {
              console.error("::error::Generated theme stamp mismatch: expected " + expected + ", got " + actual);
              process.exit(1);
            }
          '
      - run: npm run contract:check
      - uses: actions/upload-artifact@v7
        with:
          name: theme-artifact-${{ inputs.theme_sha }}
          path: dist/theme.xml
          if-no-files-found: error
          retention-days: 90
