name: Repair header contracts

on:
  push:
    paths:
      - .github/workflows/repair-header-contracts.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - name: Align stale header contract assertions
        shell: python
        run: |
          from pathlib import Path

          widget_test = Path('tests/contract/m2-adversarial-widgets.test.ts')
          text = widget_test.read_text(encoding='utf-8')
          old = 'expect(header).toMatch(/<b:includable id="main" var="this">[\\s\\S]*?<div class="header-widget">/);'
          new = 'expect(header).toMatch(/<b:includable id="main" var="this">[\\s\\S]*?<a class="header-brand"/);'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one stale header-widget assertion')
          widget_test.write_text(text.replace(old, new), encoding='utf-8')

          empirical_test = Path('tests/contract/m5-challenger-empirical.test.ts')
          text = empirical_test.read_text(encoding='utf-8')
          old = 'expect(html).toMatch(/<p class="site-title"><a[^>]*>[\\s\\S]*?(?:Blog Header|Ledger Official Blog)/);'
          new = 'expect(html).toMatch(/<p class="site-title">[\\s\\S]*?(?:Blog Header|Ledger Official Blog)[\\s\\S]*?<\\/p>/);'
          if text.count(old) != 2:
              raise SystemExit('Expected exactly two stale single-view site-title assertions')
          empirical_test.write_text(text.replace(old, new), encoding='utf-8')
      - run: npm run generate
      - run: npm run golden:update
      - run: npm test
      - run: npm run test:contract
      - run: npm run contract:check
      - name: Commit verified repair and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-header-contracts.yml
          git add dist/theme.xml tests/golden/theme.xml tests/contract/m2-adversarial-widgets.test.ts tests/contract/m5-challenger-empirical.test.ts
          git commit -m "test: align header contracts with rebuilt markup"
          git push origin HEAD:main
