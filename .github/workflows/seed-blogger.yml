name: Seed Blogger development target
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type I_ACCEPT_PUBLIC_DOWNTIME to seed the approved Blogger target
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: blogger-live-writes
  cancel-in-progress: false
jobs:
  seed:
    if: inputs.confirmation == 'I_ACCEPT_PUBLIC_DOWNTIME'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: blogger-live
    env:
      BLOGGER_BLOG_ID: '5972841034338492159'
      ALLOW_LIVE_BLOG_TESTING: I_ACCEPT_PUBLIC_DOWNTIME
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Refresh short-lived access token
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: npx tsx tools/google-access-token.ts
      - name: Seed approved Blogger target
        run: npm run seed:staging
