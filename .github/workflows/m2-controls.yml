name: M2 blank-render controls
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Contempo swap controls
        run: npx tsx tools/build-controls.ts
      - name: Summarize upload order
        run: |
          {
            echo '### M2 blank-render controls'
            echo ''
            echo 'Upload one at a time, then report which renders posts.'
            echo ''
            echo '1. `control-b-our-shell-contempo-blog.xml` — our shell, Google Blog widget.'
            echo '   Renders posts => our Blog widget is at fault. Blank => our shell is at fault.'
            echo '2. `control-a-contempo-shell-our-blog.xml` — Google shell, our Blog widget.'
            echo '   Renders posts => our shell is at fault. Blank => our Blog widget is at fault.'
            echo ''
            echo 'Both blank means the blog configuration is at fault, not the theme.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: m2-controls-${{ github.sha }}
          path: dist/controls/
          if-no-files-found: error
          retention-days: 7
