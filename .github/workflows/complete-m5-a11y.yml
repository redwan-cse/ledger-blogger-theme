name: Complete M5 accessibility harness

on:
  push:
    paths:
      - .github/workflows/complete-m5-a11y.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Add pinned axe integration
        run: npm install --save-dev @axe-core/playwright@4.10.2 --ignore-scripts --no-audit --no-fund
      - name: Add all-view live accessibility suite
        shell: python
        run: |
          from pathlib import Path
          import json

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          data['scripts']['test:a11y'] = 'playwright test tests/render/a11y.spec.ts --project=javascript'
          package.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          Path('tests/render/a11y.spec.ts').write_text("""import AxeBuilder from '@axe-core/playwright';
          import { BloggerDiscoveryClient } from '../../tools/harness/blogger-api.js';
          import { extractThemeBuild } from '../../tools/harness/build-stamp.js';
          import { HarnessHttpClient } from '../../tools/harness/http.js';
          import { createViewTargets, type ViewTarget } from '../../tools/harness/views.js';
          import { test, expect } from './fixture.js';

          function required(name: 'STAGING_URL' | 'EXPECTED_THEME_BUILD' | 'BLOGGER_BLOG_ID' | 'LAYOUT_MODE_URL'): string {
            const value = process.env[name]?.trim();
            if (!value) throw new Error(`${name} is required for conclusive accessibility verification.`);
            return value;
          }

          let targets: ViewTarget[] = [];

          test.beforeAll(async ({ request }) => {
            const stagingUrl = required('STAGING_URL');
            const response = await request.get(stagingUrl);
            expect(response.status()).toBeLessThan(400);
            const homeHtml = await response.text();
            expect(extractThemeBuild(homeHtml)).toBe(required('EXPECTED_THEME_BUILD'));
            const client = new HarnessHttpClient();
            const discovery = new BloggerDiscoveryClient(client, {
              ...(process.env.BLOGGER_API_KEY ? { apiKey: process.env.BLOGGER_API_KEY } : {}),
              ...(process.env.BLOGGER_ACCESS_TOKEN ? { accessToken: process.env.BLOGGER_ACCESS_TOKEN } : {})
            });
            const [posts, pages] = await Promise.all([
              discovery.listAllPosts(required('BLOGGER_BLOG_ID')),
              discovery.listPages(required('BLOGGER_BLOG_ID'))
            ]);
            targets = createViewTargets(stagingUrl, posts, pages, { layoutModeUrl: required('LAYOUT_MODE_URL') });
            expect(targets.every((target) => target.url)).toBe(true);
          });

          test('R-A11Y-1: all ten real Blogger views have no serious or critical axe violations', async ({ page }) => {
            for (const target of targets) {
              await page.goto(target.url!);
              const result = await new AxeBuilder({ page }).analyze();
              const blocking = result.violations.filter((violation) => violation.impact === 'serious' || violation.impact === 'critical');
              expect(blocking, `${target.name}: ${JSON.stringify(blocking, null, 2)}`).toEqual([]);
            }
          });
          """, encoding='utf-8')
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contract
      - run: npm run contract:check
      - name: Commit verified M5 implementation and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/complete-m5-a11y.yml
          git add package.json package-lock.json tests/render/a11y.spec.ts
          git commit -m "feat(m5): add exact-SHA axe verification"
          git push origin HEAD:main
