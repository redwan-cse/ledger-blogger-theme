name: Autonomous Daily Cybersecurity Blog (Zero-Touch)

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 09:00 AM BST (03:00 AM UTC)
  workflow_dispatch:
    inputs:
      manual_category:
        description: 'Override domain category (leave blank for automatic calendar rotation)'
        required: false
        type: choice
        default: 'Auto'
        options:
          - 'Auto'
          - '[AI Security]'
          - '[Cloud Security]'
          - '[DevSecOps]'
          - '[Penetration Testing]'
          - '[Linux Hardening]'
          - '[OSINT & Threat Intel]'
          - '[Digital Forensics]'
      auto_publish:
        description: 'Immediately compile and publish to Blogger after Drive staging'
        type: boolean
        default: true

jobs:
  autonomous-blog-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: blogger-live
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # -------------------------------------------------------------
      # Step 1: Python Environment & Content Generation
      # -------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-api-python-client google-auth pillow

      - name: Generate Post, Illustrate Thumbnail & Stage to Drive
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.DRIVE_SERVICE_ACCOUNT_KEY }}
          MANUAL_CATEGORY: ${{ inputs.manual_category != 'Auto' && inputs.manual_category || '' }}
          DRIVE_ROOT_FOLDER_ID: '1bJGScEpKr2iuP6nynxAW_lNScI_8I0jq'
          DRIVE_QUEUE_FOLDER_ID: '17Il9OEUn3OluptlReqefnrn2DlfMmdbl'
          DRIVE_SHEET_ID: '1Pox6crGHIr0t8fR5iTR5CM-0e_OjAaOQ7VoKde9baro'
        run: python scripts/generate_daily_post.py

      # -------------------------------------------------------------
      # Step 2: Node.js Environment & Blogger Publication
      # -------------------------------------------------------------
      - name: Setup Node.js
        if: ${{ inputs.auto_publish == true || github.event_name == 'schedule' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Node Dependencies
        if: ${{ inputs.auto_publish == true || github.event_name == 'schedule' }}
        run: npm ci

      - name: Compile Markdown & Publish Live to Blogger
        if: ${{ inputs.auto_publish == true || github.event_name == 'schedule' }}
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          DRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.DRIVE_SERVICE_ACCOUNT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPUBLISH_LATEST: 'false'
        run: npx tsx scripts/publish-from-drive.ts
