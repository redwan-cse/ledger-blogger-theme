name: Verify shared-brand artifact live
on:
  push:
    paths:
      - .github/workflows/verify-shared-brand-live.yml
permissions:
  contents: read
concurrency:
  group: staging-blog
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: blogger-live
    timeout-minutes: 25
    env:
      SOURCE_SHA: 69ff4b5fe10acd35a99b55a4e658cb5d4dfe5eaa
      GITHUB_SHA: 69ff4b5fe10acd35a99b55a4e658cb5d4dfe5eaa
      STAGING_URL: https://blogs.redwan.work/
      BLOGGER_BLOG_ID: '5972841034338492159'
      LAYOUT_MODE_URL: ${{ secrets.LAYOUT_MODE_URL }}
      HARNESS_PACE_MS: '4000'
      EXPECTED_THEME_BUILD: 0.0.0+69ff4b5fe10acd35a99b55a4e658cb5d4dfe5eaa
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source has not drifted since the stamped implementation
        run: git diff --quiet "$SOURCE_SHA" -- src tests tools package.json package-lock.json
      - run: npm run generate
      - run: npm run contract:check
      - run: npm run test:golden
      - name: Verify exact live build stamp
        run: npm run deploy:check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh Blogger access token
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: npx tsx tools/google-access-token.ts
      - run: npm run harness
      - run: npm run harness:browser
      - run: npm run test:a11y
      - run: npm run test:lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shared-brand-live-evidence-69ff4b5
          path: |
            dist/theme.xml
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
