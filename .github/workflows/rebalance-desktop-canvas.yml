name: Rebalance desktop editorial canvas

on:
  push:
    paths:
      - .github/workflows/rebalance-desktop-canvas.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Expand the desktop shell while preserving article measure
        shell: python
        run: |
          from pathlib import Path

          tokens = Path('src/styles/tokens.scss')
          text = tokens.read_text(encoding='utf-8')
          old = '$container-max: 1100px;'
          new = '$container-max: 1280px;'
          if text.count(old) != 1:
              raise SystemExit('Expected the 1100px container token once')
          tokens.write_text(text.replace(old, new), encoding='utf-8')

          layout = Path('src/styles/layout.scss')
          text = layout.read_text(encoding='utf-8')
          old = """  .main.section,
            #page_body,
            .widget.Blog {
              grid-column: 1 / 9; // 8 columns for post stream on multiple-items views
            }
          """
          new = """  .main.section,
            #page_body,
            .widget.Blog {
              grid-column: 1 / 10; // 9 columns for a fuller editorial stream
            }
          """
          if text.count(old) != 1:
              raise SystemExit('Expected the desktop Blog span once')
          text = text.replace(old, new)
          old = """  .desktop-sidebar {
              grid-column: 9 / 13; // 4 columns for desktop sidebar
          """
          new = """  .desktop-sidebar {
              grid-column: 10 / 13; // 3 columns keeps the sidebar useful without shrinking the stream
          """
          if text.count(old) != 1:
              raise SystemExit('Expected the desktop sidebar span once')
          layout.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/contract/desktop-canvas-layout.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';
          import { generateTheme } from '../../tools/generate.js';

          const SHA = '0123456789abcdef0123456789abcdef01234567';

          describe('M3b desktop canvas composition (#15)', () => {
            it('uses a 1280px shell with a 9/3 stream-sidebar split', async () => {
              const { xml } = await generateTheme({ sha: SHA, write: false });
              expect(xml).toContain('max-width:1280px');
              expect(xml).toContain('.main.section,#page_body,.widget.Blog{grid-column:1/10}');
              expect(xml).toContain('.desktop-sidebar{grid-column:10/13');
            });

            it('keeps the article reading measure capped at 68ch', async () => {
              const { xml } = await generateTheme({ sha: SHA, write: false });
              expect(xml).toContain('.post-body{font-family:');
              expect(xml).toContain('max-width:68ch');
              expect(xml).toContain('.is-post .post,.is-page .post{grid-column:3/11');
            });
          });
          """, encoding='utf-8')
      - run: npm run generate
      - run: npm run golden:update
      - run: npm test
      - run: npm run test:contract
      - run: npm run contract:check
      - run: npm run typecheck
      - name: Commit verified slice and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebalance-desktop-canvas.yml
          git add src/styles/tokens.scss src/styles/layout.scss tests/contract/desktop-canvas-layout.test.ts dist/theme.xml tests/golden/theme.xml
          git commit -m "fix(m3b): rebalance desktop editorial canvas (#15)"
          git push origin HEAD:main
