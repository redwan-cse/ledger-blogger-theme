name: Finish live header wrapper repair

on:
  push:
    paths:
      - .github/workflows/finish-header-wrapper.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Flatten the remaining Header widget-content wrapper
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/styles/layout.scss')
          text = path.read_text(encoding='utf-8')
          old = """.header-bar > .header.section,
          .header-bar > .header.section > .widget.Header {
            display: contents;
          }
          """
          new = """.header-bar > .header.section,
          .header-bar > .header.section > .widget.Header,
          .header-bar .widget.Header > .widget-content {
            display: contents;
          }
          """
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one scoped Header wrapper rule')
          text = text.replace(old, new)

          old_dark = """  .site-title a,
            .post-title a,
          """
          new_dark = """  .site-title,
            .site-title a,
            .post-title a,
          """
          if text.count(old_dark) != 1:
              raise SystemExit('Expected exactly one dark title selector group')
          path.write_text(text.replace(old_dark, new_dark), encoding='utf-8')

          test = Path('tests/contract/header-wrapper-layout.test.ts')
          text = test.read_text(encoding='utf-8')
          old_assert = "expect(xml).toContain('.header-bar>.header.section,.header-bar>.header.section>.widget.Header{display:contents}');"
          new_assert = "expect(xml).toContain('.header-bar>.header.section,.header-bar>.header.section>.widget.Header,.header-bar .widget.Header>.widget-content{display:contents}');"
          if text.count(old_assert) != 1:
              raise SystemExit('Expected the prior wrapper assertion once')
          text = text.replace(old_assert, new_assert)
          marker = "expect(xml).toContain('.header-actions{order:3');"
          if text.count(marker) != 1:
              raise SystemExit('Expected header-actions assertion once')
          text = text.replace(marker, marker + "\n    expect(xml).toContain('html[data-theme=dark] .site-title,html[data-theme=dark] .site-title a');")
          test.write_text(text, encoding='utf-8')
      - run: npm run generate
      - run: npm run golden:update
      - run: npm test
      - run: npm run test:contract
      - run: npm run contract:check
      - run: npm run typecheck
      - name: Commit verified fix and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finish-header-wrapper.yml
          git add src/styles/layout.scss tests/contract/header-wrapper-layout.test.ts dist/theme.xml tests/golden/theme.xml
          git commit -m "fix(m3b): finish Header wrapper chain (#18)"
          git push origin HEAD:main
