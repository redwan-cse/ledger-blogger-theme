name: Verify M0 RED control
on:
  push:
    branches: [chore/m0-scaffold]
    paths:
      - .github/workflows/m0-red-control.yml
      - tools/harness/blogger-api.ts
      - tools/harness/http.ts
      - tools/render-harness.ts
permissions:
  contents: write
concurrency:
  group: blogger-live-reads
  cancel-in-progress: false
jobs:
  red-control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: blogger-live
    env:
      STAGING_URL: https://blogs.redwan.work/
      EXPECTED_THEME_BUILD: 0.0.0+96c0ce5b442f7ad2612b3f27aae5441f17166482
      BLOGGER_BLOG_ID: '5972841034338492159'
      HARNESS_PACE_MS: '30000'
      HARNESS_TIMEOUT_MS: '30000'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/m0-scaffold
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Refresh short-lived access token
        id: refresh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: npx tsx tools/google-access-token.ts
      - name: Cool down Blogger before the single measured run
        run: sleep 120
      - name: Run stamp-gated empty-theme harness
        id: harness
        shell: bash
        run: |
          set +e
          npm run harness 2>&1 | tee m0-red.log
          harness_status=${PIPESTATUS[0]}
          set -e
          echo "status=$harness_status" >> "$GITHUB_OUTPUT"
      - name: Build audit evidence
        if: always()
        shell: bash
        run: |
          {
            echo '# M0 stamped empty-theme RED evidence'
            echo
            echo '- Workflow commit: `${{ github.sha }}`'
            echo '- Deployed build expected and verified by harness: `${{ env.EXPECTED_THEME_BUILD }}`'
            echo '- OAuth refresh step: `${{ steps.refresh.outcome }}`'
            echo '- Harness step: `${{ steps.harness.outcome }}`'
            echo '- Harness exit: `${{ steps.harness.outputs.status }}`'
            echo
            echo '```text'
            if [[ -f m0-red.log ]]; then cat m0-red.log; fi
            echo '```'
          } > "$RUNNER_TEMP/m0-red-evidence.md"
          cat "$RUNNER_TEMP/m0-red-evidence.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Persist audit evidence safely
        if: always()
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch origin chore/m0-scaffold
            git reset --hard origin/chore/m0-scaffold
            git clean -fd
            cp "$RUNNER_TEMP/m0-red-evidence.md" docs/m0-red-evidence.md
            git add docs/m0-red-evidence.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'test(m0): record stamped live RED evidence'
            if git push origin HEAD:chore/m0-scaffold; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Failed to persist evidence after 3 synchronized attempts.'
          exit 1
      - name: Enforce valid RED control
        if: always()
        shell: bash
        run: |
          [[ '${{ steps.refresh.outcome }}' == 'success' ]]
          [[ '${{ steps.harness.outputs.status }}' == '1' ]]
          grep -q '"outcome": "FAIL"' m0-red.log
          if grep -q '\[BLOCKED\]' m0-red.log; then exit 1; fi
          if grep -q '\[ERROR\]' m0-red.log; then exit 1; fi
