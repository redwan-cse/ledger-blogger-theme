name: Live UI diagnostic

on:
  push:
    paths:
      - .github/workflows/live-ui-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: staging-blog
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: blogger-live
    timeout-minutes: 15
    env:
      STAGING_URL: https://blogs.redwan.work/
      BLOGGER_BLOG_ID: '5972841034338492159'
      LAYOUT_MODE_URL: ${{ secrets.LAYOUT_MODE_URL }}
      HARNESS_PACE_MS: '4000'
      EXPECTED_THEME_BUILD: 0.0.0+b40202fe56fece953e0f9683c185621c02e6b81d
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Refresh Blogger access token
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: npx tsx tools/google-access-token.ts
      - name: Generate exact uploaded artifact
        env:
          GITHUB_SHA: b40202fe56fece953e0f9683c185621c02e6b81d
        run: npm run generate
      - run: npm run deploy:check
      - run: npm run harness
      - run: npm run harness:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-ui-diagnostic-b40202fe
          path: |
            dist/theme.xml
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
