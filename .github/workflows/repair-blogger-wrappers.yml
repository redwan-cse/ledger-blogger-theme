name: Repair Blogger wrapper layout

on:
  push:
    paths:
      - .github/workflows/repair-blogger-wrappers.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Flatten only the platform wrappers inside the header flex row
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/styles/layout.scss')
          text = path.read_text(encoding='utf-8')
          anchor = """.header-bar {
            max-width: $container-max;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: $space-4;
          }
          """
          replacement = anchor + """
          // Blogger inserts .section and .widget wrappers between .header-bar and
          // the Header widget's authored children. Those wrappers are flex items;
          // leaving them at the global width:100% traps brand + actions in one
          // full-width item, so nav can never sit between them. Flatten only this
          // load-bearing wrapper chain. Other sections keep their normal boxes.
          .header-bar > .header.section,
          .header-bar > .header.section > .widget.Header {
            display: contents;
          }
          """
          if text.count(anchor) != 1:
              raise SystemExit('Expected exactly one header-bar block')
          path.write_text(text.replace(anchor, replacement), encoding='utf-8')

          test = Path('tests/contract/header-wrapper-layout.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';
          import { generateTheme } from '../../tools/generate.js';

          const SHA = '0123456789abcdef0123456789abcdef01234567';

          describe('Blogger header wrapper layout regression', () => {
            it('flattens only the Header section/widget wrappers so brand, nav, and actions share one flex row', async () => {
              const { xml } = await generateTheme({ sha: SHA, write: false });
              expect(xml).toContain('.header-bar>.header.section,.header-bar>.header.section>.widget.Header{display:contents}');
              expect(xml).toContain('.header-brand{order:1');
              expect(xml).toContain('.nav-container{order:2');
              expect(xml).toContain('.header-actions{order:3');
            });

            it('does not flatten generic Blogger sections or widgets', async () => {
              const { xml } = await generateTheme({ sha: SHA, write: false });
              expect(xml).not.toContain('.section,.widget{display:contents}');
              expect(xml).toContain('.section,.widget{width:100%}');
            });
          });
          """, encoding='utf-8')
      - run: npm run generate
      - run: npm run golden:update
      - run: npm test
      - run: npm run test:contract
      - run: npm run contract:check
      - run: npm run typecheck
      - name: Commit verified wrapper repair and clean one-off diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-blogger-wrappers.yml
          if [ -f .github/workflows/live-ui-diagnostic.yml ]; then git rm .github/workflows/live-ui-diagnostic.yml; fi
          git add src/styles/layout.scss tests/contract/header-wrapper-layout.test.ts dist/theme.xml tests/golden/theme.xml
          git commit -m "fix(ui): flatten Blogger header wrappers"
          git push origin HEAD:main
