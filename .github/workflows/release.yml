name: Release theme artifact

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run generate
      - run: npm run contract:check
      - run: npm run test:golden
      - name: Create checksum
        run: sha256sum dist/theme.xml > dist/theme.xml.sha256
      - name: Publish immutable GitHub release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb872386003fe0b2563ca93 # v2.2.1
        with:
          files: |
            dist/theme.xml
            dist/theme.xml.sha256
          name: Ledger ${{ github.ref_name }}
          generate_release_notes: true
