name: Release theme artifact

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run generate
      - run: npm run contract:check
      - run: npm run test:golden
      - name: Create checksum
        run: sha256sum dist/theme.xml > dist/theme.xml.sha256
      - name: Publish immutable GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/theme.xml
            dist/theme.xml.sha256
          name: Ledger ${{ github.ref_name }}
          generate_release_notes: true
