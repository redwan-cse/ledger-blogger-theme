name: Repair live harness ordering

on:
  push:
    paths:
      - .github/workflows/repair-live-harness-order.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Put credential-free evidence before OAuth-gated work
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/m2-staging.yml')
          text = workflow.read_text(encoding='utf-8')
          install_start = text.index('      - name: Install Chromium')
          generate_start = text.index('      - run: npm run generate')
          deploy_line = '        run: npm run deploy:check\n'
          deploy_end = text.index(deploy_line, generate_start) + len(deploy_line)
          install_and_oauth = text[install_start:generate_start]
          generate_and_deploy = text[generate_start:deploy_end]
          generate_and_deploy = generate_and_deploy.replace(
              'Report the deployed build stamp before asserting',
              'Report the deployed build stamp before credential-gated assertions'
          )
          workflow.write_text(
              text[:install_start] + generate_and_deploy + install_and_oauth + text[deploy_end:],
              encoding='utf-8'
          )

          test = Path('tests/contract/m2-workflow-order.test.ts')
          test.write_text("""import { readFile } from 'node:fs/promises';
          import { describe, expect, it } from 'vitest';

          describe('M2 live verification evidence order (#17)', () => {
            it('checks the generated artifact and public deployment stamp before OAuth and browser installation', async () => {
              const workflow = await readFile('.github/workflows/m2-staging.yml', 'utf8');
              const generate = workflow.indexOf('npm run generate');
              const deploy = workflow.indexOf('npm run deploy:check');
              const chromium = workflow.indexOf('playwright install');
              const oauth = workflow.indexOf('google-access-token.ts');
              expect(generate).toBeGreaterThan(0);
              expect(deploy).toBeGreaterThan(generate);
              expect(chromium).toBeGreaterThan(deploy);
              expect(oauth).toBeGreaterThan(chromium);
            });
          });
          """, encoding='utf-8')
      - run: npm test
      - run: npm run test:contract
      - run: npm run contract:check
      - run: npm run typecheck
      - name: Commit verified repair and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-live-harness-order.yml
          git add .github/workflows/m2-staging.yml tests/contract/m2-workflow-order.test.ts
          git commit -m "ci(m2): preserve deploy evidence before OAuth (#17)"
          git push origin HEAD:main
