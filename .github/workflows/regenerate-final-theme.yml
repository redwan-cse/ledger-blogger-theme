name: Regenerate final Blogger theme
on:
  push:
    paths:
      - .github/workflows/regenerate-final-theme.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 69ff4b5fe10acd35a99b55a4e658cb5d4dfe5eaa
      GITHUB_SHA: 69ff4b5fe10acd35a99b55a4e658cb5d4dfe5eaa
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contract
      - run: npm run contract:check
      - run: npm run test:golden
      - name: Verify exact source stamp
        run: grep -F '0.0.0+69ff4b5fe10acd35a99b55a4e658cb5d4dfe5eaa' dist/theme.xml
      - name: Commit regenerated artifact if changed and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate-final-theme.yml
          git add dist/theme.xml tests/golden/theme.xml
          if git diff --cached --quiet; then
            echo "artifact already deterministic"
          else
            git commit -m "build: regenerate final Blogger theme"
            git push origin HEAD:main
          fi
