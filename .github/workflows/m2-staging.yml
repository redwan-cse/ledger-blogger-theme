name: M2 staging validation
on:
  workflow_dispatch:
    inputs:
      theme_sha:
        description: Full 40-character SHA of the theme.xml artifact uploaded to Blogger (optional; defaults to HEAD)
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: staging-blog
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    environment: blogger-live
    timeout-minutes: 30
    steps:
      - name: Resolve target theme SHA
        id: resolve
        run: |
          TARGET_SHA="${{ inputs.theme_sha }}"
          if [ -z "$TARGET_SHA" ]; then
            TARGET_SHA="${{ github.sha }}"
          fi
          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::theme_sha must be a full lowercase 40-character commit SHA, got '$TARGET_SHA'"
            exit 1
          fi
          echo "theme_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "expected_build=0.0.0+$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.theme_sha }}
      - uses: actions/setup-node@v4

        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate theme for target SHA
        env:
          THEME_SHA: ${{ steps.resolve.outputs.theme_sha }}
        run: npm run generate
      - name: Assert generated theme build stamp equals expected theme_sha
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.theme_sha }}
        run: |
          node -e '
            const fs = require("fs");
            const xml = fs.readFileSync("dist/theme.xml", "utf8");
            const expected = "0.0.0+" + process.env.EXPECTED_SHA;
            const match = xml.match(/content=["\x27]([^"\x27]+)["\x27]\s+name=["\x27]theme-build["\x27]/) || xml.match(/name=["\x27]theme-build["\x27]\s+content=["\x27]([^"\x27]+)["\x27]/);
            const actual = match ? match[1] : "";
            console.log("Expected local build stamp: " + expected);
            console.log("Actual local build stamp:   " + actual);
            if (actual !== expected) {
              console.error("::error::Generated theme stamp mismatch: expected " + expected + ", got " + actual);
              process.exit(1);
            }
          '
      - run: npm run contract:check
      - run: npm run test:golden
      - name: Report the deployed build stamp before credential-gated assertions
        env:
          STAGING_URL: https://blogs.redwan.work/
          EXPECTED_THEME_BUILD: ${{ steps.resolve.outputs.expected_build }}
        run: npm run deploy:check
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Refresh short-lived Blogger access token
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: npx tsx tools/google-access-token.ts
      - name: Verify home and post Lighthouse budgets
        env:
          STAGING_URL: https://blogs.redwan.work/
          BLOGGER_BLOG_ID: '5972841034338492159'
          LAYOUT_MODE_URL: ${{ secrets.LAYOUT_MODE_URL }}
          HARNESS_PACE_MS: '6000'
          EXPECTED_THEME_BUILD: ${{ steps.resolve.outputs.expected_build }}
        run: |
          npm run test:lighthouse
          sleep 15
      - name: Verify rendered HTML across ten views
        env:
          STAGING_URL: https://blogs.redwan.work/
          BLOGGER_BLOG_ID: '5972841034338492159'
          LAYOUT_MODE_URL: ${{ secrets.LAYOUT_MODE_URL }}
          HARNESS_PACE_MS: '6000'
          EXPECTED_THEME_BUILD: ${{ steps.resolve.outputs.expected_build }}
        run: |
          npm run harness
          sleep 15
      - name: Verify JS, no-JS, and reduced-motion browser contexts
        env:
          STAGING_URL: https://blogs.redwan.work/
          BLOGGER_BLOG_ID: '5972841034338492159'
          LAYOUT_MODE_URL: ${{ secrets.LAYOUT_MODE_URL }}
          HARNESS_PACE_MS: '6000'
          EXPECTED_THEME_BUILD: ${{ steps.resolve.outputs.expected_build }}
        run: |
          npm run harness:browser
          sleep 15
      - name: Verify serious and critical accessibility violations
        env:
          STAGING_URL: https://blogs.redwan.work/
          BLOGGER_BLOG_ID: '5972841034338492159'
          LAYOUT_MODE_URL: ${{ secrets.LAYOUT_MODE_URL }}
          HARNESS_PACE_MS: '6000'
          EXPECTED_THEME_BUILD: ${{ steps.resolve.outputs.expected_build }}
        run: npm run test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-m6-evidence-${{ steps.resolve.outputs.theme_sha }}
          path: |
            dist/theme.xml
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
