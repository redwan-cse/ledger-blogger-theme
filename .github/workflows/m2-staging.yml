name: M2 staging validation
on:
  workflow_dispatch:
    inputs:
      theme_sha:
        description: Full 40-character SHA of the theme.xml artifact uploaded to Blogger
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: staging-blog
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    environment: blogger-live
    timeout-minutes: 30
    env:
      STAGING_URL: https://blogs.redwan.work/
      BLOGGER_BLOG_ID: '5972841034338492159'
      LAYOUT_MODE_URL: ${{ secrets.LAYOUT_MODE_URL }}
      HARNESS_PACE_MS: '4000'
      EXPECTED_THEME_BUILD: 0.0.0+${{ inputs.theme_sha }}
    steps:
      - name: Reject a malformed theme SHA before touching the blog
        run: |
          if ! printf '%s' "${{ inputs.theme_sha }}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::theme_sha must be a full lowercase 40-character commit SHA, got '${{ inputs.theme_sha }}'"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Fetch recent main history and checkout target commit SHA
        run: |
          git fetch origin main --depth=100
          git checkout "${{ inputs.theme_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate theme for target SHA
        env:
          THEME_SHA: ${{ inputs.theme_sha }}
        run: npm run generate
      - name: Assert generated theme build stamp equals expected theme_sha
        env:
          EXPECTED_SHA: ${{ inputs.theme_sha }}
        run: |
          node -e '
            const fs = require("fs");
            const xml = fs.readFileSync("dist/theme.xml", "utf8");
            const expected = "0.0.0+" + process.env.EXPECTED_SHA;
            const match = xml.match(/content=["\x27]([^"\x27]+)["\x27]\s+name=["\x27]theme-build["\x27]/) || xml.match(/name=["\x27]theme-build["\x27]\s+content=["\x27]([^"\x27]+)["\x27]/);
            const actual = match ? match[1] : "";
            console.log("Expected local build stamp: " + expected);
            console.log("Actual local build stamp:   " + actual);
            if (actual !== expected) {
              console.error("::error::Generated theme stamp mismatch: expected " + expected + ", got " + actual);
              process.exit(1);
            }
          '
      - run: npm run contract:check
      - run: npm run test:golden
      - name: Report the deployed build stamp before credential-gated assertions
        run: npm run deploy:check
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Refresh short-lived Blogger access token
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: npx tsx tools/google-access-token.ts
      - name: Verify rendered HTML across ten views
        run: npm run harness
      - name: Verify JS, no-JS, and reduced-motion browser contexts
        run: npm run harness:browser
      - name: Verify serious and critical accessibility violations
        run: npm run test:a11y
      - name: Verify home and post Lighthouse budgets
        run: npm run test:lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-m6-evidence-${{ inputs.theme_sha }}
          path: |
            dist/theme.xml
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
