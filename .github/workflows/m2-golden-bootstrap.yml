name: M2 golden bootstrap
on:
  push:
    branches: [feat/m2-render-path]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/m2-render-path
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run generate && npm run contract:check && npm run test:contract
      - name: Normalize and commit the reviewed M2 snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          xml = Path('dist/theme.xml').read_text()
          normalized, count = re.subn(r'(?<=0\.0\.0\+)[0-9a-f]{40}', 'GOLDEN_SHA_40_CHARS________________', xml, count=1)
          if count != 1:
              raise SystemExit('expected exactly one build SHA')
          Path('tests/golden/theme.xml').write_text(normalized)
          PY
          rm .github/workflows/m2-golden-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/golden/theme.xml .github/workflows/m2-golden-bootstrap.yml
          git commit -m "test(m2): refresh golden render skeleton"
          git push origin HEAD:feat/m2-render-path
