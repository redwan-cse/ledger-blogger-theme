name: Restamp recovered theme artifact
on:
  push:
    paths: [.github/workflows/restamp-brand-comments-artifact.yml]
permissions:
  contents: write
jobs:
  restamp:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 4278ec703a00805174ba2342b9841bf489ce259f
    steps:
      - uses: actions/checkout@v7
        with: {token: "${{ secrets.GITHUB_TOKEN }}", fetch-depth: 0}
      - uses: actions/setup-node@v7
        with: {node-version: '24.18.1', cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify source matches the landed implementation
        run: git diff --quiet "$SOURCE_SHA" -- src tests tools package.json package-lock.json
      - name: Generate exact-source artifact
        run: npm run generate
        env:
          GITHUB_SHA: "${{ env.SOURCE_SHA }}"
      - run: npm run golden:update
        env:
          GITHUB_SHA: "${{ env.SOURCE_SHA }}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contract
      - run: npm run contract:check
        env:
          GITHUB_SHA: "${{ env.SOURCE_SHA }}"
      - name: Commit artifact and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restamp-brand-comments-artifact.yml
          git add dist tests
          git commit -m "build: stamp theme artifact for 4278ec7"
          git pull --rebase origin main
          git push origin HEAD:main
