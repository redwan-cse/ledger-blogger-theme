name: Fix two-line brand and threaded comments UI

on:
  push:
    paths:
      - .github/workflows/fix-brand-comments-ui.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Implement confirmed live UI fixes
        shell: python
        run: |
          from pathlib import Path

          header = Path('src/widgets/header.pug')
          text = header.read_text(encoding='utf-8')
          old_title = """    b:includable(id='title')
                b:with(value='data:title ?: data:blog.title ?: \"Md Redwan Ahmed\"' var='headerTitle')
                  b:if(cond='not data:view.isSingleItem')
                    h1.site-title
                      b:eval(expr='data:headerTitle')/
                  b:if(cond='data:view.isSingleItem')
                    p.site-title
                      b:eval(expr='data:headerTitle')/
              b:includable(id='description')
                b:with(value='data:description ?: data:blog.description ?: \"Cyber Security Professional\"' var='headerDescription')
                  p.site-tagline
                    b:eval(expr='data:headerDescription')/
          """
          new_title = """    b:includable(id='title')
                //- Brand lockup intentionally uses two stable lines, matching the
                //- Fast Cyber Defense masthead. The Blogger blog title contains
                //- both phrases in one string and cannot be split safely in V3.
                b:if(cond='not data:view.isSingleItem')
                  h1.site-title Md Redwan Ahmed
                b:if(cond='data:view.isSingleItem')
                  p.site-title Md Redwan Ahmed
              b:includable(id='description')
                p.site-tagline Cyber Security Professional
          """
          if text.count(old_title) != 1:
              raise SystemExit('Expected the current Header title/description includables once')
          header.write_text(text.replace(old_title, new_title), encoding='utf-8')

          comments = Path('src/widgets/blog-comments.pug')
          text = comments.read_text(encoding='utf-8')
          old_footer = """    p.comment-footer
                b:if(cond='data:post.allowNewComments')
                  b:include(data='post' name='threadedCommentForm')/
                b:if(cond='not data:post.allowNewComments')
                  b:eval(expr='data:post.noNewCommentsText')/
          """
          new_footer = """    //- data:post.commentHtml already contains Blogger's threaded reply
              //- controls and comment editor. Rendering threadedCommentForm again
              //- creates the duplicate empty 'Post a Comment' card seen live.
              b:if(cond='not data:post.allowNewComments')
                p.comment-footer
                  b:eval(expr='data:post.noNewCommentsText')/
          """
          if text.count(old_footer) != 1:
              raise SystemExit('Expected the duplicate threaded comment footer once')
          comments.write_text(text.replace(old_footer, new_footer), encoding='utf-8')

          article = Path('src/styles/article.scss')
          text = article.read_text(encoding='utf-8')
          native = """
          // Blogger's threaded commentHtml carries native list, avatar, metadata,
          // action, reply, and load-more classes that are not produced by our
          // authored commentItem includable. Style both paths as one system.
          #comments .comment-thread {
            ol,
            ul {
              list-style: none;
              margin: 0;
              padding: 0;
            }

            li {
              list-style: none;
              margin: 0 0 $space-3;
              padding: 0;
            }

            .comment {
              position: relative;
              min-height: 72px;
              padding-left: 72px;
            }

            .avatar-image-container {
              position: absolute;
              top: $space-4;
              left: $space-4;
              width: 40px;
              height: 40px;

              img {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                border: 1px solid $rule;
                object-fit: cover;
              }
            }

            .comment-header,
            .comment-actions,
            .comment-footer {
              display: flex;
              align-items: center;
              flex-wrap: wrap;
              gap: $space-2;
            }

            .comment-header {
              margin-bottom: $space-2;
              font-family: $font-sans;
              font-size: 0.8125rem;
            }

            .user {
              font-weight: 700;
              color: $ink;
            }

            .datetime,
            .comment-timestamp {
              color: $ink-muted;
              font-family: $font-mono;
              font-size: 0.72rem;
            }

            .comment-actions {
              margin-top: $space-3;

              a {
                min-height: 36px;
                padding: $space-1 $space-2;
                border-radius: 4px;
                color: $accent;
                text-decoration: none;
                font-family: $font-sans;
                font-size: 0.8125rem;
                font-weight: 600;

                &:hover {
                  background: $accent-wash;
                }
              }
            }

            .comment-replies,
            .comment-replybox-single {
              margin-left: 48px;
              padding-left: $space-4;
              border-left: 1px solid $rule;
            }

            .continue,
            .loadmore {
              margin: $space-4 0;
              font-family: $font-sans;
              font-weight: 600;

              a {
                color: $accent;
              }
            }
          }

          html[data-theme='dark'] #comments .comment-thread {
            .user,
            .comment-header a {
              color: oklch(92% 0.01 260);
            }

            .datetime,
            .comment-timestamp {
              color: oklch(72% 0.012 260);
            }

            .comment-actions a,
            .continue a,
            .loadmore a {
              color: oklch(68% 0.19 250);
            }

            .comment-replies,
            .comment-replybox-single {
              border-left-color: oklch(28% 0.018 260);
            }
          }

          @media (max-width: 639px) {
            #comments .comment-thread {
              .comment {
                padding-left: $space-4;
              }

              .avatar-image-container {
                position: static;
                margin-bottom: $space-2;
              }

              .comment-replies,
              .comment-replybox-single {
                margin-left: $space-3;
              }
            }
          }
          """
          if '#comments .comment-thread {' not in text:
              text += native
          article.write_text(text, encoding='utf-8')

          test = Path('tests/contract/live-ui-regressions.test.ts')
          test.write_text("""import { readFile } from 'node:fs/promises';
          import { describe, expect, it } from 'vitest';
          import { generateTheme } from '../../tools/generate.js';

          const SHA = '0123456789abcdef0123456789abcdef01234567';

          describe('live UI regressions', () => {
            it('renders the brand as two explicit lines instead of the combined Blogger title', async () => {
              const { xml } = await generateTheme({ sha: SHA, write: false });
              expect(xml).toContain('<h1 class=\"site-title\">Md Redwan Ahmed</h1>');
              expect(xml).toContain('<p class=\"site-tagline\">Cyber Security Professional</p>');
              expect(xml).not.toContain('data:title ?: data:blog.title');
            });

            it('does not render a duplicate threaded comment form', async () => {
              const source = await readFile('src/widgets/blog-comments.pug', 'utf8');
              const threaded = source.slice(source.indexOf("b:includable(id='threadedComments'"));
              const section = threaded.slice(0, threaded.indexOf("b:includable(id='threadedCommentForm'"));
              expect(section).not.toContain("name='threadedCommentForm'");
              expect(section).toContain('data:post.noNewCommentsText');
            });

            it('normalizes native threaded lists, avatars, actions, replies, and dark metadata', async () => {
              const { xml } = await generateTheme({ sha: SHA, write: false });
              expect(xml).toContain('#comments .comment-thread ol,#comments .comment-thread ul{list-style:none');
              expect(xml).toContain('#comments .comment-thread .avatar-image-container{position:absolute');
              expect(xml).toContain('#comments .comment-thread .comment-actions');
              expect(xml).toContain('html[data-theme=dark] #comments .comment-thread');
            });
          });
          """, encoding='utf-8')
      - run: npm run generate
      - run: npm run golden:update
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contract
      - run: npm run contract:check
      - name: Commit verified fixes and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-brand-comments-ui.yml
          git add src/widgets/header.pug src/widgets/blog-comments.pug src/styles/article.scss tests/contract/live-ui-regressions.test.ts dist/theme.xml tests/golden/theme.xml
          git commit -m "fix(ui): two-line brand and threaded comments polish"
          git pull --rebase origin main
          git push origin HEAD:main
