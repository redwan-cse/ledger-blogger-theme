name: Publish From Google Drive (Free / Zero API Cost)

on:
  schedule:
    - cron: '15 3 * * *' # Daily at 09:15 AM BST (03:15 AM UTC, 15m after Spark runs)
    - cron: '0 4 * * *'  # Daily backup at 10:00 AM BST (04:00 AM UTC)
    - cron: '0 16 * * *' # Evening backup check at 10:00 PM BST (04:00 PM UTC)
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab
    inputs:
      republish_latest:
        description: 'Republish latest post from Blog_Published (for testing formatting updates)'
        type: boolean
        default: true

jobs:
  publish-from-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: blogger-live
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pull Google Docs & Publish to Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          DRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.DRIVE_SERVICE_ACCOUNT_KEY }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID || '1bJGScEpKr2iuP6nynxAW_lNScI_8I0jq' }}
          DRIVE_QUEUE_FOLDER_ID: ${{ vars.DRIVE_QUEUE_FOLDER_ID || '1JX_E9AAjtqZWbqG2N4KfBdYRMp748Rkv' }}
          DRIVE_PUBLISHED_FOLDER_ID: ${{ vars.DRIVE_PUBLISHED_FOLDER_ID || '1Ht4jr07tIl4Wb8OI1PVAKL5y5Ayr_XCk' }}
          DRIVE_SHEET_ID: ${{ vars.DRIVE_SHEET_ID || '1Pox6crGHIr0t8fR5iTR5CM-0e_OjAaOQ7VoKde9baro' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPUBLISH_LATEST: ${{ inputs.republish_latest || 'false' }}
        run: npx tsx scripts/publish-from-drive.ts
