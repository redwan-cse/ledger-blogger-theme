name: Publish From Google Drive (Free / Zero API Cost)

on:
  schedule:
    - cron: '0 4 * * *'  # Daily at 10:00 AM BST (04:00 AM UTC, after Apps Script runs)
    - cron: '30 4 * * *' # Backup check at 10:30 AM BST (04:30 AM UTC)
    - cron: '0 16 * * *' # Evening backup check at 10:00 PM BST (04:00 PM UTC)
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab
    inputs:
      republish_latest:
        description: 'Republish latest post from Blog_Published (for testing formatting updates)'
        type: boolean
        default: false
      target_title:
        description: 'Filter specific post title to republish (e.g. XDP)'
        type: string
        default: ''

jobs:
  publish-from-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: blogger-live
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Pull Google Docs & Publish to Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          DRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.DRIVE_SERVICE_ACCOUNT_KEY }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID || '1bJGScEpKr2iuP6nynxAW_lNScI_8I0jq' }}
          DRIVE_QUEUE_FOLDER_ID: ${{ vars.DRIVE_QUEUE_FOLDER_ID || '1qR-RZ6MA1YJmLSAFYJQ-h7bAo-cf0QLY' }}
          DRIVE_PUBLISHED_FOLDER_ID: ${{ vars.DRIVE_PUBLISHED_FOLDER_ID || '1eyxxZCJF97Krkg49osWF_dc39x1SFmDX' }}
          DRIVE_SHEET_ID: ${{ vars.DRIVE_SHEET_ID || '19XFToal3vWSZpNSW1hKksxq1uT4N-6r2FnIXeZrTkxQ' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPUBLISH_LATEST: ${{ inputs.republish_latest || 'false' }}
          TARGET_TITLE: ${{ inputs.target_title || '' }}
        run: npx tsx scripts/publish-from-drive.ts
