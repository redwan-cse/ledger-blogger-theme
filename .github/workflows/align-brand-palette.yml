name: Align Ledger brand palette
# retry after updating contrast and focus oracles
on:
  push:
    paths:
      - .github/workflows/align-brand-palette.yml
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply palette migration and contracts
        run: |
          python tools/align-brand-palette.py
          python tools/align-brand-contracts.py
      - name: Validate provisional patch
        run: |
          npm run generate
          npm run golden:update
          npm run typecheck
          npm test
          npm run test:contract
          npm run contract:check
      - name: Commit source implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs tools/align-brand-palette.py tools/align-brand-contracts.py
          git reset dist/theme.xml tests/golden/theme.xml
          git commit -m "feat(ui): align Ledger with shared Redwan palette"
          git rev-parse HEAD > /tmp/source-sha
      - name: Generate exact-source artifact and reverify
        run: |
          export GITHUB_SHA="$(cat /tmp/source-sha)"
          npm run generate
          npm run golden:update
          npm run typecheck
          npm test
          npm run test:contract
          npm run contract:check
      - name: Commit artifact and remove temporary files
        run: |
          git rm .github/workflows/align-brand-palette.yml tools/align-brand-palette.py tools/align-brand-contracts.py
          git add dist tests/golden
          git commit -m "build: stamp shared-brand palette artifact"
          git push origin HEAD:main
